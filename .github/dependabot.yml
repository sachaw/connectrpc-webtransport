version: 2
updates:
  # Every action is pinned by commit SHA; this bumps the pins and their tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
